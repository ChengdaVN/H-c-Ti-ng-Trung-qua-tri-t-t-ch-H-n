<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7C6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html{color-scheme:light dark}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Gốc Chữ Hán</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;600&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* Layout: bảng gốc chữ. Mỗi gốc Hán Việt là một ô; mở ra thành họ từ HSK 5-6 có cùng gốc, gốc được tô nổi trong từng từ. */
:root{
  --bg:#EDEFF5; --surface:#FAFBFD; --surface2:#E2E6F0; --ink:#17203D; --muted:#566086; --line:#CBD1E1;
  --accent:#0A7C6E; --accent-ink:#FFFFFF; --accent-soft:#D3EEE9; --accent-mid:#7CC4B9;
  --warn:#B3382C; --warn-soft:#F6DAD6; --gold:#8A5A00; --gold-soft:#F4E6C6;
  --font-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-han:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
  --font-py:'Noto Sans','Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1226; --surface:#161B36; --surface2:#20274A; --ink:#E9ECF8; --muted:#A0A9CC; --line:#2C3560;
    --accent:#52D1BB; --accent-ink:#06211C; --accent-soft:#17403C; --accent-mid:#2C7F73;
    --warn:#FF9486; --warn-soft:#4A2320; --gold:#F0C36A; --gold-soft:#3F3216; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1226; --surface:#161B36; --surface2:#20274A; --ink:#E9ECF8; --muted:#A0A9CC; --line:#2C3560;
  --accent:#52D1BB; --accent-ink:#06211C; --accent-soft:#17403C; --accent-mid:#2C7F73;
  --warn:#FF9486; --warn-soft:#4A2320; --gold:#F0C36A; --gold-soft:#3F3216; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:15px; line-height:1.55;
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--font-han);font-weight:700;line-height:1.15}
.py{font-family:var(--font-py)}
.muted{color:var(--muted)}
.rt{color:var(--accent)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:46px;height:46px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:28px;flex:none}
.brand h1{margin:0;font-size:20px;line-height:1.2;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface2);border-radius:10px;flex:1 1 360px;max-width:520px}
.tab{border:0;background:transparent;border-radius:7px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* shared */
h2{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:64ch}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:6px 12px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.l5{background:var(--accent-soft);color:var(--accent)}
.chip.l6{background:var(--gold-soft);color:var(--gold)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.scope{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.scope .f{display:flex;gap:8px;align-items:center;min-width:0}
.scope label{font-weight:600;font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted)}

/* gốc grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .han{font-size:46px;color:var(--accent)}
.tile b{font-size:14px;margin-top:6px}
.tile span.m{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile .cnt{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;width:100%}
.meter i{display:block;height:100%;background:var(--accent);transition:width .25s}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.step{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:14px}
.step b{color:var(--ink)}
.example{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.example .han{font-size:44px;color:var(--accent)}
.example .ws{display:flex;flex-wrap:wrap;gap:6px}
.example .w{padding:4px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:13px;display:flex;gap:8px;align-items:baseline}
.example .w .han{font-size:18px;color:var(--ink)}

/* gốc detail */
.detail{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.big{font-size:120px;color:var(--accent);line-height:1}
.kv{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:14px}
.words{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr);gap:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;align-items:center}
.wrow .hw{font-size:30px;overflow-wrap:anywhere}
.wrow .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.pyl{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pyl .py{font-size:16px;font-weight:600;color:var(--accent)}
.mean{font-weight:600}
.hvl{font-size:13px;color:var(--muted)}
@media (max-width:480px){.wrow{grid-template-columns:minmax(0,1fr)}}

/* cards */
.stage{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.card{min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.card .glyph{font-size:84px;overflow-wrap:anywhere}
.card .glyph.sm{font-size:52px}
.card .tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .pyc{font-size:24px;font-weight:600;color:var(--accent)}
.card .meanl{font-size:20px;font-weight:600;max-width:34ch;text-wrap:balance}
.hintbox{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:14px;color:var(--muted);max-width:46ch}
.hintbox b{color:var(--ink)}
.rootline{margin:0;font-size:14px;color:var(--muted);max-width:50ch}
.rootline b.han{color:var(--accent);font-size:17px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{padding:13px}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* quiz */
.qwrap{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.qhead .han{font-size:68px;overflow-wrap:anywhere}
.qhead .ask{font-weight:600;font-size:17px;max-width:32ch;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;display:flex;gap:10px;align-items:center;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.glyphopt{justify-content:center;text-align:center;flex-direction:column;gap:2px}
.opt.glyphopt .han{font-size:32px;overflow-wrap:anywhere}
.opt.rootopt .han{font-size:44px}
.opt small{color:var(--muted);font-size:12px;display:block}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt:disabled{cursor:default}
.mk{font-weight:700;margin-left:auto}
.fb{padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.fb .verdict{font-weight:700}
.fb .verdict.ok{color:var(--accent)}
.fb .verdict.no{color:var(--warn)}
.fb .han.w{font-size:34px}
.score{font-size:64px;font-weight:700;line-height:1;color:var(--accent)}
.review{display:flex;flex-wrap:wrap;gap:8px}
.rv{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
.rv .han{font-size:24px}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.seg i{display:block;height:100%}
.seg .s3{background:var(--accent)}
.seg .s1{background:var(--accent-mid)}
.lvl{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.lvl b{color:var(--ink);font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
@media (max-width:560px){.brow{grid-template-columns:minmax(0,1fr)}}
.bname{display:flex;gap:10px;align-items:center;min-width:0}
.bname .han{font-size:28px;color:var(--accent)}
.bname span{font-size:13px;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:5px}
.cell{display:inline-flex;align-items:baseline;gap:5px;border-radius:5px;padding:3px 8px;background:var(--surface2);color:var(--muted);border:1px solid transparent;font-variant-numeric:tabular-nums}
.cell .han{font-size:16px}
.cell small{font-size:10px;font-weight:600}
.cell.lv1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-mid)}
.cell.lv2{background:var(--accent-mid);color:var(--ink)}
.cell.lv3{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--surface2)}
.legend .l1::before{background:var(--accent-soft);outline:1px solid var(--accent-mid)}
.legend .l2::before{background:var(--accent-mid)}
.legend .l3::before{background:var(--accent)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.searchbar{display:flex;flex-direction:column;gap:10px}
input[type=search]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;width:100%}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;font-size:inherit}

.exs{margin-top:6px;padding:9px 12px;border-left:3px solid var(--accent-mid);background:var(--surface2);border-radius:0 6px 6px 0;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.exz{font-family:var(--font-han);font-weight:400;font-size:17px;line-height:1.5;overflow-wrap:anywhere}
.exp{font-family:var(--font-py);font-size:13px;color:var(--accent);overflow-wrap:anywhere}
.exv{font-size:13.5px;color:var(--muted)}
mark.hw{background:transparent;color:var(--accent);font-weight:700}
.card .exs{width:100%;max-width:520px}
.fb .exs{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark han" aria-hidden="true">根</div>
      <div><h1>Gốc Chữ Hán</h1><p>Từ vựng HSK 5–6 theo gốc Hán Việt</p></div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="root">Gốc</button>
      <button class="tab" role="tab" data-tab="cards">Thẻ nhớ</button>
      <button class="tab" role="tab" data-tab="quiz">Luyện tập</button>
      <button class="tab" role="tab" data-tab="prog">Tiến độ</button>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

// ---------- model ----------
const RM = {};
const WORDS = [];
ROOTS.forEach(r => {
  RM[r.c] = r;
  r.ws = r.ws.map(a => { const o = Object.assign({ id: a.w, r: r }, a); WORDS.push(o); return o; });
});
const KEY = 'gochuhan.v2';
let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { prog = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
function box(id) { return (prog[id] && prog[id].b) || 0; }
function setBox(id, b) { prog[id] = { b: Math.max(0, Math.min(5, b)) }; save(); }
function lv(b) { return b >= 4 ? 'lv3' : b >= 2 ? 'lv2' : b >= 1 ? 'lv1' : 'lv0'; }

const S = { tab:'root', root:null, q:'', size:'big', shown:60, scopeCards:'all', scopeQuiz:'all', level:'all', cards:null, quiz:null, confirmReset:false };
const $view = document.getElementById('view');

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lowFirst(items) { return shuffle(items).sort((x, y) => box(x.id) - box(y.id)); }
function inScope(x, scope) {
  if (scope === 'all') return true;
  if (scope === 'big') return x.r.ws.length >= 8;
  if (scope === 'mid') return x.r.ws.length >= 3 && x.r.ws.length < 8;
  if (scope === 'small') return x.r.ws.length < 3;
  return x.r.c === scope.slice(5);
}
function pool(scope) {
  return WORDS.filter(x => inScope(x, scope) && (S.level === 'all' || String(x.lv) === S.level));
}
function norm(t) { return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd'); }
const IDX = { roots: {}, words: {} };
ROOTS.forEach(r => { IDX.roots[r.c] = norm([r.c, r.hv, r.py, r.m].join(' ')); });
WORDS.forEach(x => { IDX.words[x.id] = norm([x.w, x.py, x.hv, x.vi].join(' ')); });
function hl(word, c) { return word.split('').map(ch => ch === c ? `<span class="rt">${ch}</span>` : ch).join(''); }
function mask(word, c) { return word.split('').map(ch => ch === c ? '<span class="rt">□</span>' : ch).join(''); }
function lvChip(x) { return `<span class="chip l${x.lv}">HSK ${x.lv}</span>`; }
function controls(scopeId, scopeVal) {
  let s = `<div class="f"><label for="${scopeId}">Phạm vi</label><select id="${scopeId}" data-act="scope">`;
  const nb = ROOTS.filter(r => r.ws.length >= 8), nm = ROOTS.filter(r => r.ws.length >= 3 && r.ws.length < 8);
  const cnt = a => a.reduce((n, r) => n + r.ws.length, 0);
  s += `<option value="all"${scopeVal === 'all' ? ' selected' : ''}>Tất cả ${WORDS.length} từ</option>`;
  s += `<option value="big"${scopeVal === 'big' ? ' selected' : ''}>Gốc lớn, từ 8 từ (${nb.length} gốc, ${cnt(nb)} từ)</option>`;
  s += `<option value="mid"${scopeVal === 'mid' ? ' selected' : ''}>Gốc vừa, 3 đến 7 từ (${nm.length} gốc, ${cnt(nm)} từ)</option>`;
  s += `<option value="small"${scopeVal === 'small' ? ' selected' : ''}>Gốc nhỏ, 1 đến 2 từ</option>`;
  if (scopeVal.startsWith('root:')) { const r = RM[scopeVal.slice(5)]; s += `<option value="${scopeVal}" selected>Gốc ${r.c} · ${r.hv} (${r.ws.length} từ)</option>`; }
  s += `</select></div><div class="f"><label for="lvsel">Cấp độ</label><select id="lvsel" data-act="level">`;
  [['all', 'HSK 5 và 6'], ['5', 'Chỉ HSK 5'], ['6', 'Chỉ HSK 6']].forEach(o => { s += `<option value="${o[0]}"${S.level === o[0] ? ' selected' : ''}>${o[1]}</option>`; });
  return `<div class="scope">${s}</select></div></div>`;
}
function exHtml(x) {
  if (!x.ez) return '';
  const z = x.ez.split(x.w).join('<mark class="hw">' + x.w + '</mark>');
  return `<div class="exs"><div class="exz" lang="zh-Hans">${z}</div><div class="exp">${x.ep}</div><div class="exv">${x.ev}</div></div>`;
}
function rootLine(x) { return `<p class="rootline">Gốc <b class="han">${x.r.c}</b> (${x.r.hv}, ${x.r.py}): ${x.r.m}.</p>`; }
function explain(x) {
  return `<div class="han w">${hl(x.w, x.r.c)}</div>
    <div class="pyl"><span class="py">${x.py}</span>${lvChip(x)}${x.hv ? `<span class="chip">Hán Việt: ${x.hv}</span>` : ''}</div>
    <div class="mean">${x.vi}</div>${exHtml(x)}${rootLine(x)}`;
}
function empty() {
  return `<div class="panel"><p class="lead" style="margin:0">Không có từ nào ở phạm vi và cấp độ này. Hãy đổi cấp độ sang «HSK 5 và 6» hoặc chọn phạm vi khác.</p></div>`;
}

// ---------- views ----------
function sizeOk(r) {
  const n = r.ws.length;
  return S.size === 'all' || (S.size === 'big' && n >= 8) || (S.size === 'mid' && n >= 3 && n < 8) || (S.size === 'small' && n < 3);
}
function tileHtml(r) {
  const n = r.ws.length, d = r.ws.filter(x => box(x.id) >= 4).length;
  return `<button class="tile" data-act="openroot" data-c="${r.c}"><span class="han" lang="zh-Hans">${r.c}</span><b>${r.hv} · ${r.py}</b><span class="m">${r.m}</span><span class="cnt">${d}/${n} từ đã thuộc</span><span class="meter" role="presentation"><i style="width:${d / n * 100}%"></i></span></button>`;
}
function resultsHtml() {
  const q = norm(S.q.trim());
  let rs = ROOTS.filter(sizeOk), wordHits = [];
  if (q) {
    rs = rs.filter(r => IDX.roots[r.c].includes(q));
    wordHits = WORDS.filter(x => sizeOk(x.r) && IDX.words[x.id].includes(q));
  }
  let h = '';
  const lim = S.shown;
  const sh = rs.slice(0, lim);
  h += `<div class="foot" style="margin-bottom:8px">${q ? `Tìm thấy ${rs.length} gốc và ${wordHits.length} từ` : `${rs.length} gốc`}</div>`;
  if (sh.length) h += `<div class="grid">${sh.map(tileHtml).join('')}</div>`;
  if (rs.length > lim) h += `<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="more">Hiện thêm ${Math.min(60, rs.length - lim)} gốc</button></div>`;
  if (q && wordHits.length) {
    h += `<h3 style="margin:20px 0 8px;font-size:16px">Từ khớp với «${S.q.trim().replace(/</g, '&lt;')}»</h3><div class="words">` + wordHits.slice(0, 40).map(x => `<article class="wrow">
      <div class="han hw" lang="zh-Hans">${hl(x.w, x.r.c)}</div>
      <div class="body"><div class="pyl"><span class="py">${x.py}</span>${lvChip(x)}</div><div class="mean">${x.vi}</div><div class="hvl">${x.hv ? 'Âm Hán Việt: ' + x.hv + ' · ' : ''}Gốc <button class="lnk" data-act="openroot" data-c="${x.r.c}">${x.r.c} (${x.r.hv})</button></div>${exHtml(x)}</div></article>`).join('') + `</div>` + (wordHits.length > 40 ? `<div class="foot" style="margin-top:8px">Còn ${wordHits.length - 40} từ nữa, hãy gõ cụ thể hơn.</div>` : '');
  }
  if (!rs.length && !wordHits.length) h += `<div class="panel"><p class="lead" style="margin:0">Không có kết quả. Thử gõ chữ Hán, pinyin hoặc âm Hán Việt, có dấu hay không dấu đều được.</p></div>`;
  return h;
}
function renderResults() { const el = document.getElementById('results'); if (el) el.innerHTML = resultsHtml(); }
function viewRoots() {
  if (S.root) return viewRootDetail(RM[S.root]);
  const ex = RM['工'];
  const exw = ex.ws.slice(0, 4).map(x => `<span class="w"><span class="han" lang="zh-Hans">${hl(x.w, ex.c)}</span>${x.vi}</span>`).join('');
  const sizes = [['all', 'Tất cả'], ['big', 'Gốc lớn (8+ từ)'], ['mid', 'Gốc vừa (3-7)'], ['small', 'Gốc nhỏ (1-2)']];
  const chips = sizes.map(o => `<button class="fchip" data-act="size" data-v="${o[0]}" aria-pressed="${S.size === o[0]}">${o[1]}</button>`).join('');
  return `<div class="stage" style="gap:20px">
    <div><h2>${ROOTS.length} gốc Hán Việt, ${WORDS.length} từ HSK 5–6</h2>
    <p class="lead">Mỗi gốc là một chữ Hán Việt quen thuộc. Nắm nghĩa của gốc rồi học cả họ từ có chung gốc đó, bạn sẽ đoán được nghĩa từ mới và nhớ lâu hơn. Nên bắt đầu từ các gốc lớn vì chúng gặp nhiều nhất.</p></div>
    <div class="example"><span class="han" lang="zh-Hans">${ex.c}</span><div class="ws">${exw}</div></div>
    <div class="steps">
      <div class="step"><b>1.</b><span><b>Chọn một gốc</b> và đọc họ từ kèm âm Hán Việt.</span></div>
      <div class="step"><b>2.</b><span><b>Ôn bằng thẻ nhớ.</b> Dùng gợi ý gốc và âm Hán Việt để đoán nghĩa.</span></div>
      <div class="step"><b>3.</b><span><b>Luyện tập</b> bằng trắc nghiệm, kể cả điền gốc còn thiếu.</span></div>
    </div>
    <div class="searchbar"><label for="q" class="sr">Tìm gốc hoặc từ</label><input id="q" type="search" placeholder="Tìm chữ Hán, pinyin, âm Hán Việt hoặc nghĩa, ví dụ: quyết tâm" value="${S.q.replace(/"/g, '&quot;')}" autocomplete="off"><div class="fchips">${chips}</div></div>
    <div id="results">${resultsHtml()}</div>
    <p class="foot">Từ vựng lấy theo bộ HSK 2.0, cấp 5 và cấp 6 (nguồn: complete-hsk-vocabulary). 31 gốc đầu tiên được soạn kỹ từng từ. Các gốc còn lại được gom tự động theo chữ xuất hiện nhiều nhất trong từ, nên một số gốc chỉ có 1 đến 2 từ. Nghĩa tiếng Việt, âm Hán Việt và câu ví dụ do mình biên soạn, pinyin của câu được sinh tự động nên vài chỗ đa âm có thể lệch. Bạn đối chiếu thêm với từ điển khi cần.</p>
  </div>`;
}
function viewRootDetail(r) {
  const n5 = r.ws.filter(x => x.lv === 5).length, n6 = r.ws.length - n5;
  const rows = r.ws.map(x => `<article class="wrow">
      <div class="han hw" lang="zh-Hans">${hl(x.w, r.c)}</div>
      <div class="body"><div class="pyl"><span class="py">${x.py}</span>${lvChip(x)}</div><div class="mean">${x.vi}</div>${x.hv ? `<div class="hvl">Âm Hán Việt: ${x.hv}</div>` : ''}${exHtml(x)}</div>
    </article>`).join('');
  return `<div class="stage" style="gap:16px">
    <div class="row"><button class="btn small" data-act="back">← Tất cả gốc</button></div>
    <div class="detail">
      <aside class="panel">
        <div class="han big" lang="zh-Hans">${r.c}</div>
        <h2 style="margin-top:6px">${r.hv} <span class="py" style="color:var(--accent)">${r.py}</span></h2>
        <div class="kv">
          <div><b>Nghĩa gốc dùng trong từ ghép:</b> ${r.m}</div>
          <div>${r.note}</div>
          <div class="row"><span class="chip l5">HSK 5: ${n5} từ</span><span class="chip l6">HSK 6: ${n6} từ</span></div>
        </div>
        <div class="row" style="margin-top:16px">
          <button class="btn primary small" data-act="studyroot" data-c="${r.c}">Ôn gốc này bằng thẻ</button>
          <button class="btn small" data-act="quizroot" data-c="${r.c}">Làm bài luyện</button>
        </div>
      </aside>
      <section class="words" aria-label="Từ có gốc ${r.c}">${rows}</section>
    </div>
  </div>`;
}

function startCards(scope) {
  S.scopeCards = scope;
  const items = lowFirst(pool(scope)).slice(0, 12);
  S.cards = { queue: items.map(x => x.id), total: items.length, done: 0, ok: 0, no: 0, flipped: false, hint: 0, requeued: {} };
}
function findWord(id) { return WORDS.find(x => x.id === id); }

function viewCards() {
  const head = controls('cardscope', S.scopeCards);
  if (!S.cards) startCards(S.scopeCards);
  const C = S.cards;
  if (!C.total) return `<div class="stage">${head}${empty()}</div>`;
  if (!C.queue.length) {
    return `<div class="stage">${head}
      <div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">
        <h2>Hoàn thành lượt ôn</h2>
        <p class="lead" style="margin:0">Nhớ ngay: <b>${C.ok}</b> lần · Chưa nhớ: <b>${C.no}</b> lần trong ${C.total} thẻ.</p>
        <div class="row" style="justify-content:center"><button class="btn primary" data-act="newcards">Ôn lượt mới</button><button class="btn" data-act="gotoquiz">Làm bài luyện</button></div>
      </div></div>`;
  }
  const x = findWord(C.queue[0]);
  const pct = Math.round(C.done / C.total * 100);
  const maxHint = x.hv ? 2 : 1;
  let face;
  if (C.flipped) {
    face = `<span class="tag">Đáp án</span><div class="han glyph sm" lang="zh-Hans">${hl(x.w, x.r.c)}</div><div class="pyc">${x.py}</div><div class="meanl">${x.vi}</div><div class="row" style="justify-content:center">${lvChip(x)}${x.hv ? `<span class="chip">Hán Việt: ${x.hv}</span>` : ''}</div>${exHtml(x)}${rootLine(x)}`;
  } else {
    let hint = '<span class="muted" style="font-size:13px">Chạm vào thẻ để lật</span>';
    if (C.hint >= 1) hint = `<div class="hintbox"><span>Gốc <b class="han rt" style="font-size:20px">${x.r.c}</b> · ${x.r.hv}: <b>${x.r.m}</b></span>${C.hint >= 2 ? `<span>Âm Hán Việt: <b>${x.hv}</b></span>` : ''}</div>`;
    face = `<span class="tag">Đoán nghĩa của từ này</span><div class="han glyph" lang="zh-Hans">${C.hint >= 1 ? hl(x.w, x.r.c) : x.w}</div>${lvChip(x)}${hint}`;
  }
  const actions = C.flipped
    ? `<div class="actions"><button class="btn warn" data-act="no">← Chưa nhớ</button><button class="btn primary" data-act="ok">Nhớ rồi →</button></div>`
    : `<div class="actions"><button class="btn" data-act="hint"${C.hint >= maxHint ? ' disabled' : ''}>${C.hint === 0 ? 'Gợi ý: gốc của từ' : 'Gợi ý: âm Hán Việt'}</button><button class="btn primary" data-act="flip">Lật thẻ</button></div>`;
  return `<div class="stage">${head}
    <div><div class="meta"><span>Thẻ ${Math.min(C.done + 1, C.total)} / ${C.total}</span><span>Hộp ${box(x.id)} / 5</span></div><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="card" data-act="flip" tabindex="0" role="button" aria-label="Lật thẻ">${face}</div>
    ${actions}
    <div class="kbd">Phím tắt: Space lật thẻ · ← chưa nhớ · → nhớ rồi</div>
  </div>`;
}

function mkQuiz(scope) {
  S.scopeQuiz = scope;
  const single = scope !== 'all';
  const items = lowFirst(pool(scope)).slice(0, single ? 8 : 10);
  const types = single ? ['mean', 'word'] : ['mean', 'gap', 'word'];
  const all = pool('all').length >= 4 ? pool('all') : WORDS;
  const qs = shuffle(items).map((x, i) => {
    const type = types[i % types.length];
    let opts, ans;
    const sameRoot = shuffle(WORDS.filter(y => y.r === x.r && y !== x));
    const other = shuffle(WORDS.filter(y => y.r !== x.r));
    if (type === 'mean') {
      ans = x.vi;
      const d = sameRoot.slice(0, 2).concat(other).filter(y => y.vi !== x.vi).slice(0, 3);
      opts = shuffle([ans, ...d.map(y => y.vi)]);
    } else if (type === 'word') {
      ans = x.w;
      const d = sameRoot.slice(0, 2).concat(other).slice(0, 3);
      opts = shuffle([ans, ...d.map(y => y.w)]);
    } else {
      ans = x.r.c;
      opts = shuffle([ans, ...shuffle(ROOTS.filter(r => r !== x.r && !x.w.includes(r.c) && r.ws.length >= 3)).slice(0, 3).map(r => r.c)]);
    }
    return { x, type, opts, ans, picked: null, hint: false };
  });
  S.quiz = { qs, i: 0, score: 0, wrong: [] };
}

function viewQuiz() {
  const head = controls('quizscope', S.scopeQuiz);
  if (!S.quiz) mkQuiz(S.scopeQuiz);
  const Q = S.quiz;
  if (!Q.qs.length) return `<div class="stage">${head}${empty()}</div>`;
  if (Q.i >= Q.qs.length) {
    const rv = Q.wrong.map(x => `<div class="rv"><span class="han" lang="zh-Hans">${x.w}</span><span><span class="py" style="color:var(--accent);font-weight:600">${x.py}</span><br><span style="font-size:13px">${x.vi}</span></span></div>`).join('');
    return `<div class="stage">${head}
      <div class="panel" style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center">
        <div class="score">${Q.score}/${Q.qs.length}</div>
        <p class="lead" style="margin:0">${Q.wrong.length ? 'Các từ cần ôn thêm:' : 'Bạn trả lời đúng tất cả.'}</p>
        ${rv ? `<div class="review" style="justify-content:center">${rv}</div>` : ''}
        <div class="row" style="justify-content:center"><button class="btn primary" data-act="newquiz">Làm bài mới</button><button class="btn" data-act="gotocards">Ôn bằng thẻ nhớ</button></div>
      </div></div>`;
  }
  const q = Q.qs[Q.i], x = q.x, answered = q.picked !== null;
  const pct = Math.round(Q.i / Q.qs.length * 100);
  let top;
  if (q.type === 'mean') {
    const hint = q.hint || answered
      ? `<div class="hintbox"><span>Gốc <b class="han rt" style="font-size:20px">${x.r.c}</b> · ${x.r.hv}: <b>${x.r.m}</b></span>${x.hv ? `<span>Âm Hán Việt: <b>${x.hv}</b></span>` : ''}</div>`
      : '<button class="btn small" data-act="qhint">Gợi ý: gốc của từ</button>';
    top = `<div class="han" lang="zh-Hans">${q.hint || answered ? hl(x.w, x.r.c) : x.w}</div><div class="py muted" style="font-size:15px">${x.py}</div><div class="ask">Từ này nghĩa là gì?</div>${hint}`;
  } else if (q.type === 'gap') {
    const hint = (q.hint || answered) && x.hv ? `<div class="hintbox"><span>Âm Hán Việt: <b>${x.hv}</b></span></div>` : (!answered && x.hv ? '<button class="btn small" data-act="qhint">Gợi ý: âm Hán Việt</button>' : '');
    top = `<div class="han" lang="zh-Hans">${answered ? hl(x.w, x.r.c) : mask(x.w, x.r.c)}</div><div class="py muted" style="font-size:15px">${x.py}</div><div class="ask">Chữ gốc nào còn thiếu?</div><div class="mean">${x.vi}</div>${hint}`;
  } else {
    top = `<div class="ask" style="font-size:24px">«${x.vi}»</div><div class="ask muted" style="font-size:14px;font-weight:500">Chọn từ có nghĩa này</div>`;
  }
  const opts = q.opts.map((o, idx) => {
    let cls = 'opt' + (q.type === 'mean' ? '' : ' glyphopt') + (q.type === 'gap' ? ' rootopt' : ''), mk = '';
    if (answered) {
      if (o === q.ans) { cls += ' right'; mk = '<span class="mk">✓</span>'; }
      else if (idx === q.picked) { cls += ' wrong'; mk = '<span class="mk">✗</span>'; }
    }
    let inner;
    if (q.type === 'mean') inner = `<span>${o}</span>`;
    else if (q.type === 'gap') inner = `<span class="han" lang="zh-Hans">${o}</span><small>${RM[o].hv}</small>`;
    else inner = `<span class="han" lang="zh-Hans">${o}</span>`;
    return `<button class="${cls}" data-act="pick" data-i="${idx}"${answered ? ' disabled' : ''}>${inner}${q.type === 'mean' ? mk : ''}</button>`;
  }).join('');
  let fb = '';
  if (answered) {
    const ok = q.opts[q.picked] === q.ans;
    fb = `<div class="fb"><div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Chính xác' : '✗ Chưa đúng'}</div>${explain(x)}</div>
      <div class="row"><button class="btn primary" data-act="next">${Q.i + 1 >= Q.qs.length ? 'Xem kết quả' : 'Câu tiếp theo'}</button></div>`;
  }
  return `<div class="stage">${head}
    <div><div class="meta"><span>Câu ${Q.i + 1} / ${Q.qs.length}</span><span>Đúng ${Q.score}</span></div><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    <div class="qwrap"><div class="qhead">${top}</div><div class="opts">${opts}</div>${fb}</div>
  </div>`;
}

function viewProgress() {
  let n3 = 0, n1 = 0;
  const byLv = { 5: [0, 0], 6: [0, 0] };
  WORDS.forEach(x => { const b = box(x.id); byLv[x.lv][1]++; if (b >= 4) { n3++; byLv[x.lv][0]++; } else if (b >= 1) n1++; });
  const n0 = WORDS.length - n3 - n1;
  const seg = `<div class="seg" role="img" aria-label="${n3} đã thuộc, ${n1} đang học, ${n0} chưa học"><i class="s3" style="width:${n3 / WORDS.length * 100}%"></i><i class="s1" style="width:${n1 / WORDS.length * 100}%"></i></div>`;
  const started = ROOTS.filter(r => r.ws.some(x => box(x.id) >= 1));
  const rows = started.map(r => {
    const cells = r.ws.map(x => { const b = box(x.id); return `<span class="cell ${lv(b)}" title="${x.w} · ${x.vi} · hộp ${b}/5"><span class="han" lang="zh-Hans">${x.w}</span><small>${b}</small></span>`; }).join('');
    return `<div class="brow"><div class="bname"><span class="han" lang="zh-Hans">${r.c}</span><div><b>${r.hv}</b><br><span>${r.ws.filter(x => box(x.id) >= 4).length}/${r.ws.length} từ đã thuộc</span></div></div><div class="cells">${cells}</div></div>`;
  }).join('');
  const reset = S.confirmReset
    ? `<div class="row"><span class="muted" style="font-size:14px">Xóa toàn bộ tiến độ học?</span><button class="btn warn small" data-act="reset2">Xóa hết</button><button class="btn small" data-act="reset0">Giữ lại</button></div>`
    : `<button class="btn small" data-act="reset1">Đặt lại tiến độ</button>`;
  return `<div class="stage" style="gap:18px">
    <div><h2>Tiến độ học</h2><p class="lead">Mỗi từ nằm trong hộp từ 0 đến 5. Từ hộp 4 trở lên được tính là đã thuộc. Tiến độ lưu trên trình duyệt này.</p></div>
    <div class="stats"><div class="stat"><b>${n3}</b><span>Đã thuộc</span></div><div class="stat"><b>${n1}</b><span>Đang học</span></div><div class="stat"><b>${n0}</b><span>Chưa học</span></div></div>
    ${seg}
    <div class="lvl"><span>HSK 5: đã thuộc <b>${byLv[5][0]}/${byLv[5][1]}</b></span><span>HSK 6: đã thuộc <b>${byLv[6][0]}/${byLv[6][1]}</b></span></div>
    <div class="legend"><span>Chưa học</span><span class="l1">Hộp 1</span><span class="l2">Hộp 2–3</span><span class="l3">Hộp 4–5 (đã thuộc)</span></div>
    <h3 style="margin:4px 0 0;font-size:16px">Các gốc bạn đã học (${started.length}/${ROOTS.length})</h3>
    ${rows ? `<div class="board">${rows}</div>` : '<div class="panel"><p class="lead" style="margin:0">Chưa có gốc nào. Hãy ôn vài thẻ hoặc làm một bài luyện, tiến độ sẽ hiện ở đây.</p></div>'}
    <div>${reset}</div>
  </div>`;
}

// ---------- render + events ----------
function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab ? 'true' : 'false'));
  $view.innerHTML = S.tab === 'root' ? viewRoots() : S.tab === 'cards' ? viewCards() : S.tab === 'quiz' ? viewQuiz() : viewProgress();
}
function go(tab) { S.tab = tab; if (tab !== 'prog') S.confirmReset = false; render(); window.scrollTo(0, 0); }

function answerCard(ok) {
  const C = S.cards; if (!C || !C.queue.length || !C.flipped) return;
  const id = C.queue.shift();
  if (ok) { setBox(id, box(id) + 1); C.ok++; C.done++; }
  else { setBox(id, 1); C.no++; if (!C.requeued[id]) { C.requeued[id] = 1; C.queue.push(id); } else C.done++; }
  C.flipped = false; C.hint = 0;
  render();
}
function flip() { const C = S.cards; if (!C || !C.queue.length) return; C.flipped = !C.flipped; render(); }

document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(b.dataset.tab); });
$view.addEventListener('change', e => {
  const a = e.target.dataset.act;
  if (a === 'scope') { if (e.target.id === 'cardscope') startCards(e.target.value); else mkQuiz(e.target.value); render(); }
  else if (a === 'level') { S.level = e.target.value; if (S.tab === 'cards') startCards(S.scopeCards); else mkQuiz(S.scopeQuiz); S.cards = S.tab === 'cards' ? S.cards : null; S.quiz = S.tab === 'quiz' ? S.quiz : null; render(); }
});
$view.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value; S.shown = 60; renderResults();
});
$view.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT') return;
  const a = t.dataset.act;
  if (a === 'size') { S.size = t.dataset.v; S.shown = 60; render(); const q = document.getElementById('q'); if (q && S.q) { q.focus(); } }
  else if (a === 'more') { S.shown += 60; renderResults(); }
  else if (a === 'openroot') { S.root = t.dataset.c; render(); window.scrollTo(0, 0); }
  else if (a === 'back') { S.root = null; render(); window.scrollTo(0, 0); }
  else if (a === 'studyroot') { startCards('root:' + t.dataset.c); go('cards'); }
  else if (a === 'quizroot') { mkQuiz('root:' + t.dataset.c); go('quiz'); }
  else if (a === 'flip') flip();
  else if (a === 'hint') { S.cards.hint++; render(); }
  else if (a === 'ok') answerCard(true);
  else if (a === 'no') answerCard(false);
  else if (a === 'newcards') { startCards(S.scopeCards); render(); }
  else if (a === 'gotoquiz') { go('quiz'); }
  else if (a === 'gotocards') { startCards(S.scopeQuiz); go('cards'); }
  else if (a === 'newquiz') { mkQuiz(S.scopeQuiz); render(); }
  else if (a === 'qhint') { S.quiz.qs[S.quiz.i].hint = true; render(); }
  else if (a === 'pick') {
    const q = S.quiz.qs[S.quiz.i]; if (q.picked !== null) return;
    q.picked = +t.dataset.i;
    if (q.opts[q.picked] === q.ans) { S.quiz.score++; setBox(q.x.id, box(q.x.id) + 1); }
    else { S.quiz.wrong.push(q.x); setBox(q.x.id, 1); }
    render();
  }
  else if (a === 'next') { S.quiz.i++; render(); window.scrollTo(0, 0); }
  else if (a === 'reset1') { S.confirmReset = true; render(); }
  else if (a === 'reset0') { S.confirmReset = false; render(); }
  else if (a === 'reset2') { prog = {}; save(); S.confirmReset = false; S.cards = null; S.quiz = null; render(); }
});
document.addEventListener('keydown', e => {
  if (S.tab !== 'cards' || !S.cards || !S.cards.queue.length) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'select' || tag === 'input') return;
  if (e.key === ' ' && tag !== 'button') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') answerCard(true);
  else if (e.key === 'ArrowLeft') answerCard(false);
});

render();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
